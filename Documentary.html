<html>
<head> 
    <title>Belajar Html dan Css</title>
    <link rel="Stylesheet" href="style.css">
</head>
<body>




<!-- TABEL SISWA SMK -->
<!-- thead sebagai baris pertama header-->
<!-- <tr> berarti table row yang mengacu pada sebuah baris yang berisi nilai/data di dalamnya -->
<!-- <th> adalah list data untuk header yang membuat tulisan pada header menjadi tebal(bold)  -->
<!-- data data yang akan muncul pada baris tersebut ditulis dalam bentuk list berikut -->
<table border="1" >
    <thead align="center">
        <tr>
            <th>No</th>
            <th>Nama</th>
            <th>Kelas</th>
            <th>Jenis Kelamin</th>
        </tr>
      
    </thead>



<!-- tbody sebagai baris kedua setelah baris table header -->
<!-- jika membuat tbody lagi setelah ini, maka akan menjadi baris selanjutnya dari baris tbody ini -->
<!-- konsep <tr> di tbody ini masih sama dengan yang ada di thead -->
<!-- data data berikut akan muncul di baris kedua dari baris head, namun stylenya normal/tidak bold -->
    <tbody >
        <tr>
            <td>1</td>
            <td>Surya</td>
            <td>XI TJKT 1</td>
            <td>Laki-laki</td>
        </tr>
    </tbody>

    <tbody >
        <tr>
            <td>2</td>
            <td>Rasyid</td>
            <td>XI TJKT 1</td>
            <td>Laki-laki</td>
        </tr>
    </tbody>

    <tbody >
        <tr>
            <td>3</td>
            <td>Akbar</td>
            <td>XI TJKT 1</td>
            <td>Laki-laki</td>
        </tr>
    </tbody>

</table>

<br> <!--Memberi baris kosong

<!--INPUT -->
<input type="text"/> <br>
<input type ="Date"/> <br>
<input type ="Color"/> <br>


</body>
</html>
